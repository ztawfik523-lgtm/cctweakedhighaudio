name: build

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.gitattributes'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.gitattributes'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neoforge: ["21.1.247", "21.1.248"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper JAR checksum
        shell: bash
        run: echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -

      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version

      - name: Build against NeoForge ${{ matrix.neoforge }}
        run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neoforge }} build

      - name: Verify packaged mod metadata and EXP-001 Mixin
        shell: bash
        run: |
          set -euo pipefail

          jar_path="$(find build/libs -maxdepth 1 -type f -name 'cctweakedhighaudio-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo "No built HighAudio JAR found"
            exit 1
          fi

          metadata="$(unzip -p "$jar_path" META-INF/neoforge.mods.toml)"
          if [[ -z "$metadata" ]]; then
            echo "Packaged META-INF/neoforge.mods.toml is missing or empty"
            exit 1
          fi

          if grep -Eq '\$\{[^}]+\}' <<<"$metadata"; then
            echo "Unexpanded placeholder found in packaged neoforge.mods.toml"
            exit 1
          fi

          grep -Fq 'modId="cctweakedhighaudio"' <<<"$metadata"
          grep -Fq 'modId="computercraft"' <<<"$metadata"
          grep -Fq 'versionRange="[1.120.0]"' <<<"$metadata"
          grep -Fq 'versionRange="[1.21.1]"' <<<"$metadata"
          grep -Fq 'versionRange="[21.1.247,21.2)"' <<<"$metadata"
          grep -Fq '[[mixins]]' <<<"$metadata"
          grep -Fq 'config="cctweakedhighaudio.mixins.json"' <<<"$metadata"

          jar_entries="$(unzip -Z1 "$jar_path")"
          grep -Fq 'dev/ztawfik/cctweakedhighaudio/HighAudio.class' <<<"$jar_entries"
          grep -Fq 'dev/ztawfik/cctweakedhighaudio/integration/cct/CctIntegrationSelfCheck.class' <<<"$jar_entries"
          grep -Fq 'dev/ztawfik/cctweakedhighaudio/integration/cct/mixin/SpeakerPeripheralMixin.class' <<<"$jar_entries"
          grep -Fq 'cctweakedhighaudio.mixins.json' <<<"$jar_entries"

          mixin_json="$(unzip -p "$jar_path" cctweakedhighaudio.mixins.json)"
          grep -Fq '"required": true' <<<"$mixin_json"
          grep -Fq '"SpeakerPeripheralMixin"' <<<"$mixin_json"

          javap -classpath "$jar_path" -v dev.ztawfik.cctweakedhighaudio.integration.cct.mixin.SpeakerPeripheralMixin > build/exp-001-mixin-javap.txt
          grep -Fq 'highAudioProbe' build/exp-001-mixin-javap.txt
          grep -Fq 'dan200.computercraft.api.lua.LuaFunction' build/exp-001-mixin-javap.txt

          echo "Verified packaged metadata, Mixin config/class, and compiled @LuaFunction probe in $jar_path"

      - name: EXP-001 dedicated-server Mixin smoke on NeoForge ${{ matrix.neoforge }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          log="build/exp-001-server-${{ matrix.neoforge }}.log"

          ./gradlew --no-daemon -Pneo_version=${{ matrix.neoforge }} runServer >"$log" 2>&1 &
          gradle_pid=$!

          cleanup() {
            pkill -TERM -P "$gradle_pid" 2>/dev/null || true
            kill "$gradle_pid" 2>/dev/null || true
            wait "$gradle_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          mixin_ok=0
          server_ready=0
          for _ in $(seq 1 180); do
            if grep -Fq '[EXP-001] SpeakerPeripheral mixin self-check PASS' "$log"; then
              mixin_ok=1
            fi
            if grep -Fq 'Done (' "$log"; then
              server_ready=1
            fi
            if [[ "$mixin_ok" -eq 1 && "$server_ready" -eq 1 ]]; then
              break
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$mixin_ok" -ne 1 || "$server_ready" -ne 1 ]]; then
            echo "EXP-001 dedicated-server smoke failed: mixin_ok=$mixin_ok server_ready=$server_ready"
            tail -n 400 "$log" || true
            exit 1
          fi

          echo "EXP-001 dedicated-server smoke passed on NeoForge ${{ matrix.neoforge }}"

      - name: Upload JAR and EXP-001 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctweakedhighaudio-neoforge-${{ matrix.neoforge }}
          path: |
            build/libs/cctweakedhighaudio-*.jar
            build/exp-001-mixin-javap.txt
            build/exp-001-server-*.log
          if-no-files-found: error
