name: build

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neoforge: ["21.1.247", "21.1.248"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build against NeoForge ${{ matrix.neoforge }}
        run: gradle --no-daemon -Pneo_version=${{ matrix.neoforge }} build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cctweakedhighaudio-neoforge-${{ matrix.neoforge }}
          path: build/libs/*.jar
          if-no-files-found: error
