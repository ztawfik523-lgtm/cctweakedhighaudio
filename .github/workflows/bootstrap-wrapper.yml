name: bootstrap-wrapper

on:
  push:
    branches: ["milestone-000-reaudit"]
    paths:
      - '.github/workflows/bootstrap-wrapper.yml'

permissions:
  contents: write

jobs:
  bootstrap-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-000-reaudit

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Generate standard Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.2.1 --distribution-type bin

      - name: Commit generated wrapper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already up to date"
            exit 0
          fi
          git commit -m "build: add standard Gradle 9.2.1 wrapper"
          git push origin HEAD:milestone-000-reaudit
